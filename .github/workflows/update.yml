name: Gunluk Nobet Verisi Guncelleme

on:
  schedule:
    - cron: '0 6 * * *' # Her gün sabah 06:00'da çalışır
  workflow_dispatch: # Manuel olarak da çalıştırılabilmesini sağlar

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Kopyala (Checkout)
        uses: actions/checkout@v3

      - name: Python Kurulumu
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Gerekli Kutuphaneleri Yukle
        run: |
          pip install requests beautifulsoup4

      - name: Guncelleme Betigini Calistir
        run: |
          python guncelle.py

      - name: Degisiklikleri GitHub'a Kaydet
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add nobet_veri.js
          git commit -m "Otomatik nobet verisi guncellendi [skip ci]" || echo "Degisiklik yok"
          git push
